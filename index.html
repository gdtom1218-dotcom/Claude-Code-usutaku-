<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chirp — シンプルなつぶやきSNS</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐤</text></svg>" />
</head>
<body>
  <header class="topbar">
    <h1 class="logo">🐤 Chirp</h1>
    <div id="userArea" class="user-area hidden">
      <span id="userName" class="user-name"></span>
      <button id="logoutBtn" class="btn btn-ghost">ログアウト</button>
    </div>
  </header>

  <main class="container">
    <!-- 認証画面 -->
    <section id="authView" class="auth-view hidden">
      <div class="card auth-card">
        <h2 id="authTitle">ログイン</h2>
        <p class="auth-sub">つぶやきを始めよう</p>

        <form id="authForm" class="auth-form" autocomplete="on">
          <div id="usernameField" class="field hidden">
            <label for="username">ユーザー名</label>
            <input id="username" type="text" placeholder="taro" maxlength="20" />
          </div>
          <div class="field">
            <label for="email">メールアドレス</label>
            <input id="email" type="email" placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label for="password">パスワード</label>
            <input id="password" type="password" placeholder="6文字以上" minlength="6" required />
          </div>

          <button id="authSubmit" type="submit" class="btn btn-primary btn-block">ログイン</button>
        </form>

        <p id="authMessage" class="auth-message"></p>

        <p class="auth-toggle">
          <span id="toggleText">アカウントをお持ちでないですか？</span>
          <a id="toggleLink" href="#">新規登録</a>
        </p>
      </div>
    </section>

    <!-- タイムライン画面 -->
    <section id="appView" class="app-view hidden">
      <div class="card composer">
        <textarea id="postInput" placeholder="いまどうしてる？" maxlength="280" rows="3"></textarea>
        <div class="composer-footer">
          <span id="charCount" class="char-count">280</span>
          <button id="postBtn" class="btn btn-primary">つぶやく</button>
        </div>
      </div>

      <div id="timeline" class="timeline">
        <p class="empty-state">読み込み中…</p>
      </div>
    </section>
  </main>

  <!-- Supabase JS クライアント（UMDビルド: window.supabase を定義） -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <!-- 接続情報（ローカルは config.js / 本番は GitHub Actions が生成） -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
